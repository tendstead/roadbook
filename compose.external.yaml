services:
  app:
    build: .
    ports: ["${ROADBOOK_BIND:-127.0.0.1}:${ROADBOOK_PORT:-8082}:8080"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL for a dedicated Roadbook database and role}
    volumes: ["attachments:/data"]
    cpus: 2
    mem_limit: 512m
    restart: unless-stopped
volumes:
  attachments:
